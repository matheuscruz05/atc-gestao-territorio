# ============================================================
# Nginx Configuration: Reverse Proxy + SSL/TLS
# Otimizado para: Dell Optplex 3040 + WiFi + Google Sheets
# ============================================================

user nginx;
worker_processes auto;
worker_rlimit_nofile 65535;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 2048;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # ============================================================
    # Logging (sem dados sensíveis)
    # ============================================================
    log_format main_secure '$remote_addr - $remote_user [$time_local] '
                           '"$request" $status $body_bytes_sent '
                           '"$http_referer" "$http_user_agent" '
                           'rt=$request_time uct="$upstream_connect_time" '
                           'uht="$upstream_header_time" urt="$upstream_response_time"';

    access_log /var/log/nginx/access.log main_secure buffer=32k flush=5s;

    # ============================================================
    # Performance & Optimization
    # ============================================================
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 120s;
    keepalive_requests 200;
    types_hash_max_size 2048;
    client_max_body_size 50M;
    
    # Buffers otimizados para WiFi
    proxy_buffer_size 128k;
    proxy_buffers 8 128k;
    proxy_busy_buffers_size 256k;
    
    # Client body buffer (uploads)
    client_body_buffer_size 128k;
    
    # Timeouts aumentados para WiFi
    client_body_timeout 60s;
    client_header_timeout 60s;
    proxy_connect_timeout 30s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;

    # ============================================================
    # Gzip Compression (economiza banda WiFi)
    # ============================================================
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types 
        text/plain 
        text/css 
        text/xml 
        text/javascript
        application/json 
        application/javascript 
        application/xml+rss
        application/rss+xml 
        font/truetype 
        font/opentype
        application/vnd.ms-fontobject 
        image/svg+xml
        application/wasm;
    gzip_min_length 1000;
    gzip_disable "msie6";

    # ============================================================
    # Security Headers
    # ============================================================
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header X-Permitted-Cross-Domain-Policies "none" always;

    # ============================================================
    # CORS Headers (para Google Sheets API)
    # ============================================================
    add_header Access-Control-Allow-Origin "$http_origin" always;
    add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Content-Type, Authorization" always;
    add_header Access-Control-Expose-Headers "Content-Length, Content-Range" always;
    add_header Access-Control-Allow-Credentials "true" always;
    add_header Access-Control-Max-Age "86400" always;

    # ============================================================
    # Rate Limiting (proteção contra abuso)
    # ============================================================
    limit_req_zone $binary_remote_addr zone=general:10m rate=20r/s;
    limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;
    limit_req_zone $binary_remote_addr zone=login:10m rate=5r/m;
    limit_req_zone $http_x_api_key zone=apikey:10m rate=100r/s;

    # ============================================================
    # Caching (melhor performance)
    # ============================================================
    proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=api_cache:10m max_size=100m inactive=60m use_temp_path=off;
    proxy_cache_path /var/cache/nginx/static levels=1:2 keys_zone=static_cache:10m max_size=50m inactive=7d use_temp_path=off;

    map $request_method $skip_cache {
        default 1;
        GET 0;
        HEAD 0;
    }

    # ============================================================
    # Upstream Services
    # ============================================================
    upstream app {
        least_conn;
        server app:3001 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }

    upstream expo {
        least_conn;
        server app:3000 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }

    # ============================================================
    # HTTP to HTTPS Redirect
    # ============================================================
    server {
        listen 80 default_server;
        listen [::]:80 default_server;
        server_name _;

        # Let's Encrypt ACME challenge
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # Redirect all other traffic to HTTPS
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ============================================================
    # HTTPS Server (Main)
    # ============================================================
    server {
        listen 443 ssl http2;
        listen [::]:443 ssl http2;
        server_name seu-dominio.com.br *.seu-dominio.com.br;

        # ============================================================
        # SSL/TLS Configuration
        # ============================================================
        ssl_certificate /etc/nginx/ssl/fullchain.pem;
        ssl_certificate_key /etc/nginx/ssl/privkey.pem;
        ssl_trusted_certificate /etc/nginx/ssl/fullchain.pem;

        # SSL Protocols & Ciphers
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers 'ECDHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-RSA-CHACHA20-POLY1305';
        ssl_prefer_server_ciphers on;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;
        ssl_session_tickets off;

        # OCSP Stapling
        ssl_stapling on;
        ssl_stapling_verify on;
        ssl_stapling_responder http://ocsp.int-x3.letsencrypt.org;

        # ============================================================
        # Security
        # ============================================================
        ssl_dhparam /etc/nginx/ssl/dhparam.pem;

        # ============================================================
        # Logging
        # ============================================================
        access_log /var/log/nginx/ssl_access.log main_secure buffer=32k flush=5s;
        error_log /var/log/nginx/ssl_error.log warn;

        # ============================================================
        # HTTP/2 Push (opcional, para performance)
        # ============================================================
        http2_push_preload on;

        # ============================================================
        # Health Check Endpoint
        # ============================================================
        location /health {
            access_log off;
            proxy_pass http://app;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header Connection "";
        }

        # ============================================================
        # tRPC API Gateway
        # ============================================================
        location /api {
            limit_req zone=api burst=50 nodelay;

            proxy_pass http://app;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;

            # Cache settings
            proxy_cache api_cache;
            proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
            proxy_cache_lock on;
            proxy_cache_key "$scheme$request_method$host$request_uri";
            add_header X-Cache-Status $upstream_cache_status;

            # Timeouts
            proxy_connect_timeout 30s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
            proxy_buffering on;
        }

        # ============================================================
        # Google Sheets Sync Endpoint (especial)
        # ============================================================
        location /api/sheets-sync {
            limit_req zone=api burst=10 nodelay;

            proxy_pass http://app;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Timeout aumentado para sincronização longa
            proxy_connect_timeout 30s;
            proxy_send_timeout 120s;
            proxy_read_timeout 120s;
            
            # Sem buffering para streaming
            proxy_buffering off;
            proxy_request_buffering off;
        }

        # ============================================================
        # Authentication Login (rate limited)
        # ============================================================
        location /auth/login {
            limit_req zone=login burst=5 nodelay;

            proxy_pass http://app;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_connect_timeout 30s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;
        }

        # ============================================================
        # Expo Web App
        # ============================================================
        location / {
            limit_req zone=general burst=20 nodelay;

            proxy_pass http://expo;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;

            # Timeouts
            proxy_connect_timeout 30s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        # ============================================================
        # Static Assets (com cache agressivo)
        # ============================================================
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            proxy_pass http://expo;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_cache static_cache;
            proxy_cache_valid 200 7d;
            add_header Cache-Control "public, immutable, max-age=604800";
            add_header X-Cache-Status $upstream_cache_status;
        }

        # ============================================================
        # Deny Access to Sensitive Files
        # ============================================================
        location ~ /\. {
            deny all;
            access_log off;
            log_not_found off;
        }

        location ~ ~$ {
            deny all;
            access_log off;
            log_not_found off;
        }

        location ~ ^/(config|\.env|\.git|package\.json) {
            deny all;
            access_log off;
            log_not_found off;
        }
    }
}
